<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAMA STORE - Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    button {
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    #logout {
      background: white;
      color: #111;
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 15px;
    }

    #login-box {
      max-width: 400px;
      margin: 80px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,.08);
    }

    #login-box h2 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    #login-button {
      width: 100%;
      background: #111;
      color: white;
      margin-top: 10px;
    }

    #admin-panel {
      display: none;
    }

    /* PUSH NOTIFICATIONS */

    .notification-box {
      background: white;
      border-radius: 15px;
      padding: 20px;
      margin: 20px 0;
      box-shadow: 0 4px 18px rgba(0,0,0,.06);
    }

    .notification-box h3 {
      margin-top: 0;
    }

    #enable-notifications {
      background: #b88b5a;
      color: white;
      width: 100%;
      margin-top: 8px;
    }

    #notification-status {
      margin: 12px 0 0;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .success {
      color: #15803d;
    }

    .error {
      color: #c00;
    }

    .info-message {
      color: #555;
    }

    /* STATISTICS */

    .stats {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 15px;
      margin: 25px 0;
    }

    .stat-card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    .stat-card span {
      display: block;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .stat-card strong {
      display: block;
      font-size: 25px;
      margin-bottom: 5px;
    }

    .stat-card small {
      color: #777;
    }

    /* SEARCH */

    .search-box {
      margin: 20px 0;
    }

    #search-orders {
      width: 100%;
      padding: 15px 18px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      margin: 0;
    }

    #search-orders:focus {
      border-color: #111;
    }

    /* ORDERS */

    .order {
      background: white;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,.06);
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      border-bottom: 1px solid #eee;
      padding-bottom: 12px;
      margin-bottom: 15px;
    }

    .order h3 {
      margin: 0;
    }

    .info {
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .products {
      background: #f7f7f7;
      padding: 12px;
      border-radius: 10px;
      margin: 15px 0;
      line-height: 1.8;
    }

    .total {
      font-size: 20px;
      font-weight: bold;
    }

    .status {
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #ddd;
      background: white;
    }

    /* DELETE */

    .delete-order {
      background: #dc2626;
      color: white;
      margin-top: 10px;
    }

    .delete-order:hover {
      opacity: .85;
    }

    .empty {
      text-align: center;
      padding: 40px;
      background: white;
      border-radius: 15px;
    }

    /* MOBILE */

    @media (max-width: 900px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 500px) {
      header {
        padding: 15px;
      }

      header h1 {
        font-size: 17px;
      }

      .container {
        margin: 20px auto;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .stat-card {
        padding: 15px 8px;
      }

      .stat-card span {
        font-size: 23px;
      }

      .stat-card strong {
        font-size: 19px;
      }

      .stat-card small {
        font-size: 12px;
      }

      .order {
        padding: 15px;
      }

      .order-header {
        flex-direction: column;
      }

      .status {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>DAMA STORE — ADMIN</h1>
    <button id="logout">Déconnexion</button>
  </header>

  <!-- LOGIN -->

  <div id="login-box">
    <h2>Connexion Admin</h2>

    <input
      type="email"
      id="email"
      placeholder="Email"
      autocomplete="username"
    >

    <input
      type="password"
      id="password"
      placeholder="Mot de passe"
      autocomplete="current-password"
    >

    <button id="login-button">
      Se connecter
    </button>

    <div id="login-error" class="error"></div>
  </div>

  <!-- ADMIN PANEL -->

  <div id="admin-panel">
    <div class="container">

      <h2>Commandes</h2>

      <!-- PUSH NOTIFICATIONS -->

      <div class="notification-box">
        <h3>🔔 Notifications des nouvelles commandes</h3>

        <p>
          Active les notifications pour recevoir les alertes
          sur cet appareil.
        </p>

        <button id="enable-notifications" type="button">
          Activer les notifications
        </button>

        <p id="notification-status" class="info-message">
          Notifications non activées.
        </p>
      </div>

      <!-- STATISTICS -->

      <div class="stats">

        <div class="stat-card">
          <span>📦</span>
          <strong id="total-orders">0</strong>
          <small>الطلبات</small>
        </div>

        <div class="stat-card">
          <span>🆕</span>
          <strong id="new-orders">0</strong>
          <small>جديدة</small>
        </div>

        <div class="stat-card">
          <span>✅</span>
          <strong id="confirmed-orders">0</strong>
          <small>مؤكدة</small>
        </div>

        <div class="stat-card">
          <span>🚚</span>
          <strong id="shipped-orders">0</strong>
          <small>مشحونة</small>
        </div>

        <div class="stat-card">
          <span>💰</span>
          <strong id="total-sales">0 DH</strong>
          <small>المبيعات</small>
        </div>

      </div>

      <!-- SEARCH -->

      <div class="search-box">
        <input
          type="text"
          id="search-orders"
          placeholder="🔍 بحث بالاسم، الهاتف أو المدينة..."
        >
      </div>

      <!-- ORDERS -->

      <div id="orders-container">
        Chargement...
      </div>

    </div>
  </div>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      getDatabase,
      ref,
      onValue,
      update,
      remove,
      set
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    import {
      getMessaging,
      getToken,
      onMessage,
      isSupported
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";


    // =========================
    // FIREBASE CONFIG
    // =========================

    const firebaseConfig = {
      apiKey: "AIzaSyBoIHMObJyJ7ehdPX5pfSwb3QYzxL0QO-Q",
      authDomain: "dama-store-7fd69.firebaseapp.com",
      databaseURL: "https://dama-store-7fd69-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "dama-store-7fd69",
      storageBucket: "dama-store-7fd69.firebasestorage.app",
      messagingSenderId: "1076285666524",
      appId: "1:1076285666524:web:15e9b02fcd7ea67ecdb019"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);


    // =========================
    // ADMIN UID
    // =========================

    const ADMIN_UID = "XmTHlhCgDyY5JhGONjipnjx7SJq2";


    // =========================
    // FCM PUBLIC VAPID KEY
    // =========================

    const VAPID_KEY =
      "BJiVtfJbwX9Ho36Nr8Qo6icWv6jLrPIa3YM9yWBjkxKDRoK8GGZdP01cOa9Iu6BD0ylIOl_KjKf8uUmnZHRHh6k";


    // =========================
    // ELEMENTS
    // =========================

    const loginBox = document.getElementById("login-box");
    const adminPanel = document.getElementById("admin-panel");
    const loginButton = document.getElementById("login-button");
    const logoutButton = document.getElementById("logout");
    const loginError = document.getElementById("login-error");
    const ordersContainer = document.getElementById("orders-container");

    const enableNotificationsButton =
      document.getElementById("enable-notifications");

    const notificationStatus =
      document.getElementById("notification-status");


    // =========================
    // STATE
    // =========================

    let ordersListenerStarted = false;
    let messagingInstance = null;


    // =========================
    // NOTIFICATION STATUS
    // =========================

    function setNotificationStatus(message, type = "info-message") {
      notificationStatus.textContent = message;
      notificationStatus.className = type;
    }


    // =========================
    // LOGIN
    // =========================

    loginButton.addEventListener("click", async () => {

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      loginError.textContent = "";

      if (!email || !password) {
        loginError.textContent = "دخل الإيميل والباسوورد.";
        return;
      }

      try {
        const result = await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        if (result.user.uid !== ADMIN_UID) {
          await signOut(auth);
          loginError.textContent = "هاد الحساب ماشي Admin.";
          return;
        }

        showAdmin();

      } catch (error) {
        console.error(error);
        loginError.textContent = "Email أو Password غير صحيح.";
      }
    });


    // =========================
    // CHECK USER
    // =========================

    onAuthStateChanged(auth, (user) => {

      console.log("ADMIN UID:", user?.uid);

      if (!user) {
        loginBox.style.display = "block";
        adminPanel.style.display = "none";
        ordersListenerStarted = false;
        return;
      }

      if (user.uid !== ADMIN_UID) {
        signOut(auth);
        return;
      }

      showAdmin();
    });


    // =========================
    // SHOW ADMIN
    // =========================

    function showAdmin() {
      loginBox.style.display = "none";
      adminPanel.style.display = "block";

      loadOrders();
      updateNotificationButton();
    }


    // =========================
    // LOAD ORDERS
    // =========================

    function loadOrders() {

      // Avoid attaching duplicate Firebase listeners.
      if (ordersListenerStarted) return;
      ordersListenerStarted = true;

      const ordersRef = ref(db, "orders");

      onValue(
        ordersRef,
        (snapshot) => {

          const data = snapshot.val() || {};

          window.allOrders = Object.entries(data).map(
            ([id, order]) => ({
              id,
              ...order
            })
          );

          updateStats(window.allOrders);
          applySearch();

        },
        (error) => {

          console.error("Firebase ERROR:", error);

          ordersContainer.textContent =
            "Erreur Firebase : " + error.message;

        }
      );
    }


    // =========================
    // STATISTICS
    // =========================

    function updateStats(orders) {

      const totalOrders = orders.length;

      const newOrders = orders.filter(
        order => order.status === "nouvelle"
      ).length;

      const confirmedOrders = orders.filter(
        order => order.status === "confirmée"
      ).length;

      const shippedOrders = orders.filter(
        order => order.status === "expédiée"
      ).length;

      const totalSales = orders.reduce(
        (sum, order) => sum + Number(order.total || 0),
        0
      );

      document.getElementById("total-orders").textContent =
        totalOrders;

      document.getElementById("new-orders").textContent =
        newOrders;

      document.getElementById("confirmed-orders").textContent =
        confirmedOrders;

      document.getElementById("shipped-orders").textContent =
        shippedOrders;

      document.getElementById("total-sales").textContent =
        totalSales.toLocaleString("fr-FR") + " DH";
    }


    // =========================
    // DISPLAY ORDERS
    // =========================

    function displayOrders(orders) {

      ordersContainer.innerHTML = "";

      if (orders.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "📭 ما كاين حتى طلب.";
        ordersContainer.appendChild(empty);
        return;
      }

      orders.slice().reverse().forEach(order => {

        const orderElement = document.createElement("div");
        orderElement.className = "order";

        const orderHeader = document.createElement("div");
        orderHeader.className = "order-header";

        const heading = document.createElement("h3");
        heading.textContent = "Commande #" + String(order.id).slice(-6);

        const statusSelect = document.createElement("select");
        statusSelect.className = "status";
        statusSelect.dataset.id = order.id;

        [
          ["nouvelle", "Nouvelle"],
          ["confirmée", "Confirmée"],
          ["expédiée", "Expédiée"],
          ["livrée", "Livrée"]
        ].forEach(([value, label]) => {
          const option = document.createElement("option");
          option.value = value;
          option.textContent = label;
          option.selected = order.status === value;
          statusSelect.appendChild(option);
        });

        orderHeader.append(heading, statusSelect);

        const info = document.createElement("div");
        info.className = "info";

        const customer = order.customer || {};

        function addInfoLine(label, value) {
          const strong = document.createElement("strong");
          strong.textContent = label + " : ";

          info.appendChild(strong);
          info.appendChild(document.createTextNode(value || "-"));
          info.appendChild(document.createElement("br"));
        }

        addInfoLine("Nom", String(customer.name || ""));
        addInfoLine("Téléphone", String(customer.phone || ""));
        addInfoLine("Ville", String(customer.city || ""));
        addInfoLine("Adresse", String(customer.address || ""));

        const productsBox = document.createElement("div");
        productsBox.className = "products";

        const productsTitle = document.createElement("strong");
        productsTitle.textContent = "Produits :";
        productsBox.appendChild(productsTitle);

        (Array.isArray(order.products) ? order.products : []).forEach(product => {
          const line = document.createElement("div");

          const name = String(product.name || "Produit");
          const quantity = Number(product.quantity || 0);
          const subtotal = Number(product.subtotal || 0)
            .toLocaleString("fr-FR");

          line.textContent =
            `${name} × ${quantity} = ${subtotal} DH`;

          productsBox.appendChild(line);
        });

        const total = document.createElement("div");
        total.className = "total";
        total.textContent =
          "Total : " +
          Number(order.total || 0).toLocaleString("fr-FR") +
          " DH";

        const dateParagraph = document.createElement("p");
        const dateLabel = document.createElement("strong");
        dateLabel.textContent = "Date : ";

        const dateText = order.createdAt
          ? new Date(order.createdAt).toLocaleString("fr-FR")
          : "-";

        dateParagraph.append(
          dateLabel,
          document.createTextNode(dateText)
        );

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-order";
        deleteButton.dataset.id = order.id;
        deleteButton.textContent = "🗑️ Supprimer";

        orderElement.append(
          orderHeader,
          info,
          productsBox,
          total,
          dateParagraph,
          deleteButton
        );

        ordersContainer.appendChild(orderElement);
      });

      attachOrderEvents();
    }


    // =========================
    // STATUS + DELETE
    // =========================

    function attachOrderEvents() {

      document.querySelectorAll(".status").forEach(select => {

        select.addEventListener("change", async () => {

          try {
            await update(
              ref(db, `orders/${select.dataset.id}`),
              { status: select.value }
            );

          } catch (error) {
            console.error(error);
            alert("❌ Impossible de modifier le statut");
          }

        });

      });

      document.querySelectorAll(".delete-order").forEach(button => {

        button.addEventListener("click", async () => {

          const orderId = button.dataset.id;

          const confirmation = confirm(
            "⚠️ واش متأكد بغيتي تحذف هاد الطلب؟"
          );

          if (!confirmation) return;

          try {
            await remove(ref(db, `orders/${orderId}`));

          } catch (error) {
            console.error(error);
            alert("❌ Impossible de supprimer la commande");
          }

        });

      });
    }


    // =========================
    // SEARCH
    // =========================

    function applySearch() {

      const search = document.getElementById("search-orders")
        .value.toLowerCase().trim();

      const allOrders = window.allOrders || [];

      const filteredOrders = allOrders.filter(order => {

        const name = String(order.customer?.name || "").toLowerCase();
        const phone = String(order.customer?.phone || "").toLowerCase();
        const city = String(order.customer?.city || "").toLowerCase();

        return (
          name.includes(search) ||
          phone.includes(search) ||
          city.includes(search)
        );
      });

      displayOrders(filteredOrders);
    }

    document.getElementById("search-orders")
      .addEventListener("input", applySearch);


    // =========================
    // PUSH NOTIFICATIONS
    // =========================

    async function updateNotificationButton() {

      if (!("Notification" in window)) {
        enableNotificationsButton.disabled = true;
        setNotificationStatus(
          "Notifications non prises en charge par ce navigateur.",
          "error"
        );
        return;
      }

      if (!window.isSecureContext) {
        enableNotificationsButton.disabled = true;
        setNotificationStatus(
          "Ouvre cette page depuis HTTPS pour activer les notifications.",
          "error"
        );
        return;
      }

      if (Notification.permission === "granted") {
        setNotificationStatus(
          "Permission accordée. Appuie sur le bouton pour enregistrer cet appareil.",
          "success"
        );
      } else if (Notification.permission === "denied") {
        setNotificationStatus(
          "Notifications bloquées. Vérifie les réglages de notifications de Safari ou de l’application web.",
          "error"
        );
      } else {
        setNotificationStatus(
          "Appuie sur le bouton puis autorise les notifications.",
          "info-message"
        );
      }
    }


    enableNotificationsButton.addEventListener("click", async () => {

      enableNotificationsButton.disabled = true;
      enableNotificationsButton.textContent = "Activation...";

      try {

        const user = auth.currentUser;

        if (!user || user.uid !== ADMIN_UID) {
          throw new Error("Connecte-toi avec le compte Admin.");
        }

        if (!("Notification" in window)) {
          throw new Error("Ce navigateur ne prend pas en charge les notifications.");
        }

        if (!window.isSecureContext) {
          throw new Error("La page doit être ouverte en HTTPS.");
        }

        // iPhone/iPad web push requires an installed Home Screen web app
        // and a supported iOS version.
        const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
        const isStandalone =
          window.matchMedia("(display-mode: standalone)").matches ||
          window.navigator.standalone === true;

        if (isIOS && !isStandalone) {
          throw new Error(
            "Sur iPhone, ajoute d'abord cette page à l'écran d'accueil, puis ouvre-la depuis son icône."
          );
        }

        if (Notification.permission !== "granted") {
          const permission = await Notification.requestPermission();

          if (permission !== "granted") {
            throw new Error("Tu n'as pas autorisé les notifications.");
          }
        }

        const supported = await isSupported();

        if (!supported) {
          throw new Error("Firebase Messaging n'est pas pris en charge par ce navigateur.");
        }

        // Register the service worker located beside admin.html.
        const registration = await navigator.serviceWorker.register(
          "./firebase-messaging-sw.js"
        );

        await navigator.serviceWorker.ready;

        messagingInstance = getMessaging(app);

        const token = await getToken(messagingInstance, {
          vapidKey: VAPID_KEY,
          serviceWorkerRegistration: registration
        });

        if (!token) {
          throw new Error("Firebase n'a pas retourné de token pour cet appareil.");
        }

        // Save this device token for the Admin account.
        // Database rules must restrict this path to the Admin.
        await set(
          ref(db, `adminNotificationTokens/${user.uid}`),
          {
            token,
            updatedAt: Date.now(),
            userAgent: navigator.userAgent
          }
        );

        setNotificationStatus(
          "✅ Notifications autorisées et appareil enregistré. L'envoi automatique nécessite aussi une fonction Firebase côté serveur.",
          "success"
        );

        // Receive messages while this Admin page is open.
        onMessage(messagingInstance, (payload) => {

          console.log("Message reçu au premier plan :", payload);

          const title =
            payload.notification?.title || "DAMA STORE";

          const body =
            payload.notification?.body || "Nouvelle notification.";

          // Foreground messages are shown in the page status.
          setNotificationStatus(
            "🔔 " + title + " — " + body,
            "success"
          );
        });

      } catch (error) {

        console.error("Notification setup error:", error);

        setNotificationStatus(
          "❌ " + (error.message || "Une erreur est survenue."),
          "error"
        );

      } finally {

        enableNotificationsButton.disabled = false;
        enableNotificationsButton.textContent =
          "Activer les notifications";

      }
    });


    // =========================
    // LOGOUT
    // =========================

    logoutButton.addEventListener("click", async () => {
      await signOut(auth);
    });

  </script>

</body>
</html>

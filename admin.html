<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAMA STORE - Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    button {
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    #logout {
      background: white;
      color: #111;
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 15px;
    }

    #login-box {
      max-width: 400px;
      margin: 80px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,.08);
    }

    #login-box h2 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    #login-button {
      width: 100%;
      background: #111;
      color: white;
      margin-top: 10px;
    }

    #admin-panel {
      display: none;
    }

    /* =========================
       STATISTICS
    ========================= */

    .stats {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 15px;
      margin: 25px 0;
    }

    .stat-card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    .stat-card span {
      display: block;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .stat-card strong {
      display: block;
      font-size: 25px;
      margin-bottom: 5px;
    }

    .stat-card small {
      color: #777;
    }

    /* =========================
       SEARCH
    ========================= */

    .search-box {
      margin: 20px 0;
    }

    #search-orders {
      width: 100%;
      padding: 15px 18px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      margin: 0;
    }

    #search-orders:focus {
      border-color: #111;
    }

    /* =========================
       ORDERS
    ========================= */

    .order {
      background: white;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,.06);
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      border-bottom: 1px solid #eee;
      padding-bottom: 12px;
      margin-bottom: 15px;
    }

    .order h3 {
      margin: 0;
    }

    .info {
      line-height: 1.7;
    }

    .products {
      background: #f7f7f7;
      padding: 12px;
      border-radius: 10px;
      margin: 15px 0;
      line-height: 1.8;
    }

    .total {
      font-size: 20px;
      font-weight: bold;
    }

    .status {
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #ddd;
      background: white;
    }

    /* =========================
       DELETE
    ========================= */

    .delete-order {
      background: #dc2626;
      color: white;
      margin-top: 10px;
    }

    .delete-order:hover {
      opacity: .85;
    }

    .error {
      color: #c00;
      margin-top: 10px;
    }

    .empty {
      text-align: center;
      padding: 40px;
      background: white;
      border-radius: 15px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 900px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 500px) {
      header {
        padding: 15px;
      }

      header h1 {
        font-size: 17px;
      }

      .container {
        margin: 20px auto;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .stat-card {
        padding: 15px 8px;
      }

      .stat-card span {
        font-size: 23px;
      }

      .stat-card strong {
        font-size: 19px;
      }

      .stat-card small {
        font-size: 12px;
      }

      .order {
        padding: 15px;
      }

      .order-header {
        flex-direction: column;
      }

      .status {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>DAMA STORE — ADMIN</h1>
    <button id="logout">Déconnexion</button>
  </header>

  <!-- LOGIN -->

  <div id="login-box">

    <h2>Connexion Admin</h2>

    <input
      type="email"
      id="email"
      placeholder="Email"
    >

    <input
      type="password"
      id="password"
      placeholder="Mot de passe"
    >

    <button id="login-button">
      Se connecter
    </button>

    <div id="login-error" class="error"></div>

  </div>


  <!-- ADMIN PANEL -->

  <div id="admin-panel">

    <div class="container">

      <h2>Commandes</h2>


      <!-- STATISTICS -->

      <div class="stats">

        <div class="stat-card">
          <span>📦</span>
          <strong id="total-orders">0</strong>
          <small>الطلبات</small>
        </div>

        <div class="stat-card">
          <span>🆕</span>
          <strong id="new-orders">0</strong>
          <small>جديدة</small>
        </div>

        <div class="stat-card">
          <span>✅</span>
          <strong id="confirmed-orders">0</strong>
          <small>مؤكدة</small>
        </div>

        <div class="stat-card">
          <span>🚚</span>
          <strong id="shipped-orders">0</strong>
          <small>مشحونة</small>
        </div>

        <div class="stat-card">
          <span>💰</span>
          <strong id="total-sales">0 DH</strong>
          <small>المبيعات</small>
        </div>

      </div>


      <!-- SEARCH -->

      <div class="search-box">

        <input
          type="text"
          id="search-orders"
          placeholder="🔍 بحث بالاسم، الهاتف أو المدينة..."
        >

      </div>


      <!-- ORDERS -->

      <div id="orders-container">
        Chargement...
      </div>

    </div>

  </div>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


    import {
      getDatabase,
      ref,
      onValue,
      update,
      remove
    }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


    // =========================
    // FIREBASE
    // =========================

    const firebaseConfig = {
      apiKey: "AIzaSyBoIHMObJyJ7ehdPX5pfSwb3QYzxL0QO-Q",
      authDomain: "dama-store-7fd69.firebaseapp.com",
      databaseURL: "https://dama-store-7fd69-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "dama-store-7fd69",
      storageBucket: "dama-store-7fd69.firebasestorage.app",
      messagingSenderId: "1076285666524",
      appId: "1:1076285666524:web:15e9b02fcd7ea67ecdb019"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getDatabase(app);


    // =========================
    // ADMIN UID
    // =========================

    const ADMIN_UID =
      "XmTHlhCgDyY5JhGONjipnjx7SJq2";


    // =========================
    // ELEMENTS
    // =========================

    const loginBox =
      document.getElementById("login-box");

    const adminPanel =
      document.getElementById("admin-panel");

    const loginButton =
      document.getElementById("login-button");

    const logoutButton =
      document.getElementById("logout");

    const loginError =
      document.getElementById("login-error");

    const ordersContainer =
      document.getElementById("orders-container");


    // =========================
    // LOGIN
    // =========================

    loginButton.addEventListener("click", async () => {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      loginError.textContent = "";


      if (!email || !password) {

        loginError.textContent =
          "دخل الإيميل والباسوورد.";

        return;
      }


      try {

        const result =
          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


        if (result.user.uid !== ADMIN_UID) {

          await signOut(auth);

          loginError.textContent =
            "هاد الحساب ماشي Admin.";

          return;
        }


        showAdmin();


      } catch (error) {

        console.error(error);

        loginError.textContent =
          "Email أو Password غير صحيح.";

      }

    });


    // =========================
    // CHECK USER
    // =========================

    onAuthStateChanged(auth, (user) => {

      console.log("ADMIN UID:", user?.uid);


      if (!user) {

        loginBox.style.display = "block";

        adminPanel.style.display = "none";

        return;
      }


      if (user.uid !== ADMIN_UID) {

        signOut(auth);

        return;
      }


      showAdmin();

    });


    // =========================
    // SHOW ADMIN
    // =========================

    function showAdmin() {

      loginBox.style.display = "none";

      adminPanel.style.display = "block";

      loadOrders();

    }


    // =========================
    // LOAD ORDERS
    // =========================

    function loadOrders() {

      const ordersRef =
        ref(db, "orders");


      onValue(

        ordersRef,

        (snapshot) => {

          const data =
            snapshot.val() || {};


          window.allOrders =
            Object.entries(data).map(
              ([id, order]) => ({
                id,
                ...order
              })
            );


          updateStats(
            window.allOrders
          );


          displayOrders(
            window.allOrders
          );

        },


        (error) => {

          console.error(
            "Firebase ERROR:",
            error
          );


          ordersContainer.innerHTML = `
            <div class="empty">
              ❌ Erreur Firebase :
              ${error.message}
            </div>
          `;

        }

      );

    }


    // =========================
    // STATISTICS
    // =========================

    function updateStats(orders) {

      const totalOrders =
        orders.length;


      const newOrders =
        orders.filter(
          order =>
            order.status === "nouvelle"
        ).length;


      const confirmedOrders =
        orders.filter(
          order =>
            order.status === "confirmée"
        ).length;


      const shippedOrders =
        orders.filter(
          order =>
            order.status === "expédiée"
        ).length;


      const totalSales =
        orders.reduce(
          (sum, order) =>
            sum + Number(order.total || 0),
          0
        );


      document.getElementById(
        "total-orders"
      ).textContent =
        totalOrders;


      document.getElementById(
        "new-orders"
      ).textContent =
        newOrders;


      document.getElementById(
        "confirmed-orders"
      ).textContent =
        confirmedOrders;


      document.getElementById(
        "shipped-orders"
      ).textContent =
        shippedOrders;


      document.getElementById(
        "total-sales"
      ).textContent =
        totalSales.toLocaleString("fr-FR")
        + " DH";

    }


    // =========================
    // DISPLAY ORDERS
    // =========================

    function displayOrders(orders) {

      ordersContainer.innerHTML = "";


      if (orders.length === 0) {

        ordersContainer.innerHTML = `
          <div class="empty">
            📭 ما كاين حتى طلب.
          </div>
        `;

        return;
      }


      orders
        .slice()
        .reverse()
        .forEach(order => {


          const productsHTML =
            (order.products || [])
              .map(product => `
                <div>
                  ${product.name}
                  × ${product.quantity}
                  =
                  ${Number(product.subtotal || 0).toLocaleString("fr-FR")}
                  DH
                </div>
              `)
              .join("");


          const date =
            order.createdAt
              ? new Date(
                  order.createdAt
                ).toLocaleString("fr-FR")
              : "-";


          ordersContainer.innerHTML += `

            <div class="order">

              <div class="order-header">

                <h3>
                  Commande #${order.id.slice(-6)}
                </h3>


                <select
                  class="status"
                  data-id="${order.id}"
                >

                  <option
                    value="nouvelle"
                    ${order.status === "nouvelle" ? "selected" : ""}
                  >
                    Nouvelle
                  </option>


                  <option
                    value="confirmée"
                    ${order.status === "confirmée" ? "selected" : ""}
                  >
                    Confirmée
                  </option>


                  <option
                    value="expédiée"
                    ${order.status === "expédiée" ? "selected" : ""}
                  >
                    Expédiée
                  </option>


                  <option
                    value="livrée"
                    ${order.status === "livrée" ? "selected" : ""}
                  >
                    Livrée
                  </option>

                </select>

              </div>


              <div class="info">

                <strong>Nom :</strong>
                ${order.customer?.name || "-"}
                <br>

                <strong>Téléphone :</strong>
                ${order.customer?.phone || "-"}
                <br>

                <strong>Ville :</strong>
                ${order.customer?.city || "-"}
                <br>

                <strong>Adresse :</strong>
                ${order.customer?.address || "-"}

              </div>


              <div class="products">

                <strong>Produits :</strong>

                ${productsHTML}

              </div>


              <div class="total">

                Total :
                ${Number(order.total || 0).toLocaleString("fr-FR")}
                DH

              </div>


              <p>

                <strong>Date :</strong>
                ${date}

              </p>


              <button
                class="delete-order"
                data-id="${order.id}"
              >
                🗑️ Supprimer
              </button>


            </div>

          `;

        });


      attachOrderEvents();

    }


    // =========================
    // STATUS + DELETE
    // =========================

    function attachOrderEvents() {


      document
        .querySelectorAll(".status")
        .forEach(select => {

          select.addEventListener(
            "change",
            async () => {

              try {

                await update(
                  ref(
                    db,
                    `orders/${select.dataset.id}`
                  ),
                  {
                    status: select.value
                  }
                );

              } catch (error) {

                console.error(error);

                alert(
                  "❌ Impossible de modifier le statut"
                );

              }

            }
          );

        });


      document
        .querySelectorAll(".delete-order")
        .forEach(button => {

          button.addEventListener(
            "click",
            async () => {

              const orderId =
                button.dataset.id;


              const confirmation =
                confirm(
                  "⚠️ واش متأكد بغيتي تحذف هاد الطلب؟"
                );


              if (!confirmation) return;


              try {

                await remove(
                  ref(
                    db,
                    `orders/${orderId}`
                  )
                );

              } catch (error) {

                console.error(error);

                alert(
                  "❌ Impossible de supprimer la commande"
                );

              }

            }
          );

        });

    }


    // =========================
    // SEARCH
    // =========================

    document
      .getElementById("search-orders")
      .addEventListener(
        "input",
        function () {

          const search =
            this.value
              .toLowerCase()
              .trim();


          const filteredOrders =
            window.allOrders.filter(order => {

              const name =
                String(
                  order.customer?.name || ""
                ).toLowerCase();


              const phone =
                String(
                  order.customer?.phone || ""
                ).toLowerCase();


              const city =
                String(
                  order.customer?.city || ""
                ).toLowerCase();


              return (
                name.includes(search) ||
                phone.includes(search) ||
                city.includes(search)
              );

            });


          displayOrders(
            filteredOrders
          );

        }
      );


    // =========================
    // LOGOUT
    // =========================

    logoutButton.addEventListener(
      "click",
      async () => {

        await signOut(auth);

      }
    );

  </script>

</body>
</html>

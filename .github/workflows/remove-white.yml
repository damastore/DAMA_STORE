name: Remove white background from watch image

on:
  push:
    paths-ignore:
      - "images/hhh.png"

permissions:
  contents: write

jobs:
  process-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove white background
        run: |
          magick images/hhh.jpeg -fuzz 10% -transparent white images/hhh.png

      - name: Commit transparent PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/hhh.png
          git diff --cached --quiet && exit 0
          git commit -m "Create transparent PNG for Emporio Armani watch"
          git push
